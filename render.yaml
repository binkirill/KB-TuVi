services:
  - type: web
    name: kb-tuvi-web
    runtime: python
    plan: free
    buildCommand: ""
    startCommand: python -X utf8 scripts/gui_server.py --host 0.0.0.0 --port $PORT --no-browser
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: ACCESS_CODE
        sync: false
      - key: DAILY_LIMIT_PER_IP
        value: "20"
