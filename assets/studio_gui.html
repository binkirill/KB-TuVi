<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>☯️ KB-TUVI STUDIO — Hệ Thống Mệnh Lý & Dịch Học Tương Tác</title>
<style>
  :root {
    --bg: #f4efe6;
    --panel: #fffdf9;
    --ink: #1e1a17;
    --muted: #6c6257;
    --border: #dcd1bf;
    --crimson: #8f1d1d;
    --crimson-soft: #fdf2f0;
    --gold: #a87928;
    --gold-soft: #fcf6e8;
    --jade: #16694f;
    --jade-soft: #e8f6f0;
    --navy: #1d4675;
    --navy-soft: #edf3fc;
    --purple: #5b3b82;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: grid; grid-template-columns: 335px 1fr; min-height: 100vh;
  }
  /* SIDEBAR */
  .sidebar {
    background: #1d1916; color: #f3ece1; padding: 18px 16px;
    border-right: 2px solid #3a312a; overflow-y: auto; max-height: 100vh; position: sticky; top: 0;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid #382f27; }
  .brand-logo { font-size: 26px; }
  .brand-title { font-weight: 800; font-size: 16px; color: #f0c97d; letter-spacing: 0.6px; }
  .brand-sub { font-size: 11px; color: #b5a998; }
  .sec-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px;
    color: #d8b268; font-weight: 700; margin: 14px 0 8px;
  }
  .field { margin-bottom: 9px; }
  .field label { display: block; font-size: 11.5px; color: #cfc5b7; margin-bottom: 3px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 7px 9px; border-radius: 6px; border: 1px solid #443a31;
    background: #2a2420; color: #fff; font-size: 12.5px;
  }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .chk-row { display: flex; align-items: center; gap: 7px; font-size: 12px; color: #dfd6c8; margin: 6px 0; cursor: pointer; }
  .chk-row input { width: auto; }
  .btn-primary {
    width: 100%; padding: 10px 12px; border: none; border-radius: 7px; cursor: pointer;
    background: linear-gradient(135deg, #a62626, #7c1616); color: #fff;
    font-weight: 800; font-size: 13.5px; letter-spacing: 0.4px; margin-top: 8px;
    box-shadow: 0 3px 10px rgba(166,38,38,0.35);
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-sec {
    padding: 6px 10px; border: 1px solid #53473c; border-radius: 6px;
    background: #2f2823; color: #f0dec1; font-size: 11.5px; cursor: pointer; font-weight: 600;
  }
  .btn-sec:hover { background: #3d342d; }
  .coin-box {
    background: #26201c; border: 1px dashed #57493c; border-radius: 7px; padding: 9px; margin-top: 6px;
  }
  .coin-lines-preview { font-family: Consolas, monospace; font-size: 11.5px; color: #f0c97d; margin-top: 6px; line-height: 1.4; }

  /* MAIN WORKSPACE */
  .main { padding: 16px 22px 36px; overflow-x: auto; }
  .sync-bar {
    background: var(--panel); border: 1px solid var(--border); border-radius: 9px;
    padding: 10px 14px; margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 10px 18px;
    align-items: center; font-size: 12.5px; box-shadow: 0 2px 8px rgba(0,0,0,0.03);
  }
  .sync-pill { padding: 3px 9px; border-radius: 99px; font-weight: 700; font-size: 11.5px; }
  .sync-ok { background: var(--jade-soft); color: var(--jade); border: 1px solid #b5e0cf; }
  .sync-warn { background: #fff3cd; color: #855a00; border: 1px solid #f0d58c; }

  /* TABS */
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .tab-btn {
    padding: 8px 15px; border-radius: 8px; border: 1px solid var(--border);
    background: #ebe4d7; color: #4f463d; font-weight: 700; font-size: 13px; cursor: pointer;
  }
  .tab-btn.active { background: var(--crimson); color: #fff; border-color: var(--crimson); }
  .toolbar-right { margin-left: auto; display: flex; gap: 8px; }
  .action-btn {
    padding: 7px 12px; border-radius: 7px; border: 1px solid var(--border);
    background: var(--panel); color: var(--ink); font-weight: 700; font-size: 12px; cursor: pointer;
  }
  .action-btn:hover { background: var(--gold-soft); border-color: var(--gold); }

  .tab-pane { display: none; }
  .tab-pane.active { display: block; }

  /* TAB 1: INTERACTIVE REACT-IZTRO STYLE BOARD */
  .tuvi-wrapper { position: relative; max-width: 1240px; margin: 0 auto; }
  .tuvi-board {
    display: grid; grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, minmax(205px, auto)); gap: 7px; position: relative;
  }
  .thien-ban {
    grid-column: 2 / 4; grid-row: 2 / 4; background: #fffbf2;
    border: 2px double var(--gold); border-radius: 9px; padding: 14px 16px;
    position: relative; z-index: 2; display: flex; flex-direction: column; justify-content: space-between;
  }
  #tptc-svg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 4;
  }
  .palace-cell {
    background: var(--panel); border: 1.5px solid var(--border); border-radius: 8px;
    padding: 7px 8px; display: flex; flex-direction: column; justify-content: space-between;
    font-size: 11.5px; cursor: pointer; transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s;
    position: relative; z-index: 3;
  }
  .palace-cell:hover { border-color: var(--gold); box-shadow: 0 3px 10px rgba(168,121,40,0.15); }
  .palace-cell.selected-palace { border: 2.5px solid var(--crimson) !important; background: #fff7f5; box-shadow: 0 0 0 3px rgba(143,29,29,0.14); }
  .palace-cell.tptc-peer { border: 2px dashed var(--gold); background: #fffdf5; }
  .palace-cell.tptc-opp { border: 2px solid var(--navy); background: #f6f9fe; }
  .p-head { display: flex; justify-content: space-between; border-bottom: 1px dashed #e5dccb; padding-bottom: 3px; font-size: 11px; }
  .p-cc { font-weight: 700; color: var(--muted); }
  .p-role { font-weight: 800; color: var(--navy); font-size: 12.5px; }
  .p-dh { font-weight: 700; color: var(--gold); }
  .p-badges { display: flex; flex-wrap: wrap; gap: 3px; margin: 3px 0; min-height: 17px; }
  .bdg { font-size: 9.5px; font-weight: 800; padding: 1px 5px; border-radius: 3px; color: #fff; }
  .bdg-menh { background: var(--crimson); }
  .bdg-than { background: var(--gold); }
  .bdg-triet { background: #1f1f1f; }
  .bdg-tuan { background: var(--purple); }
  .bdg-fly-loc { background: #0e8a5f; box-shadow: 0 0 6px rgba(14,138,95,0.5); }
  .bdg-fly-quyen { background: #c94a18; box-shadow: 0 0 6px rgba(201,74,24,0.5); }
  .bdg-fly-khoa { background: #1d5fa7; box-shadow: 0 0 6px rgba(29,95,167,0.5); }
  .bdg-fly-ky { background: #9e1136; box-shadow: 0 0 6px rgba(158,17,54,0.6); }

  .p-majors { text-align: center; min-height: 36px; margin: 2px 0; }
  .mj-item { font-size: 13.5px; font-weight: 800; }
  .mj-good { color: var(--crimson); }
  .mj-mid { color: var(--navy); }
  .mj-bad { color: #757575; }
  .p-sihua { display: flex; flex-wrap: wrap; gap: 3px; margin: 2px 0; }
  .sh-tag { font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 3px; }
  .sh-loc { background: var(--jade-soft); color: var(--jade); border: 1px solid #b4e0cd; }
  .sh-ky { background: var(--crimson-soft); color: var(--crimson); border: 1px solid #f2c0bc; }
  .sh-luu { background: var(--navy-soft); color: var(--navy); border: 1px solid #c5daf6; }
  .p-minors { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; font-size: 11px; line-height: 1.35; flex: 1; margin: 3px 0; }
  .st-cat { color: var(--jade); font-weight: 700; margin-right: 4px; display: inline-block; }
  .st-sat { color: var(--crimson); font-weight: 700; margin-right: 4px; display: inline-block; }
  .st-phu { color: #433d37; margin-right: 4px; display: inline-block; }
  .p-foot { display: flex; justify-content: space-between; border-top: 1px dashed #e5dccb; padding-top: 3px; font-size: 10.5px; color: var(--muted); font-weight: 600; }

  .tb-header { text-align: center; font-weight: 800; color: var(--crimson); font-size: 15.5px; margin-bottom: 6px; }
  .tb-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; font-size: 12px; }
  .fly-inspector {
    margin-top: 8px; padding: 8px 10px; background: #fff; border: 1px solid #e6dbc8;
    border-radius: 6px; font-size: 11.8px;
  }
  .yr-stepper { display: inline-flex; align-items: center; gap: 5px; }
  .yr-stepper button { padding: 1px 7px; cursor: pointer; border: 1px solid var(--border); background: #fff; border-radius: 4px; font-weight: 700; }

  /* CARDS & TABLES */
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 18px; margin-bottom: 16px; max-width: 1240px; margin-left: auto; margin-right: auto;
  }
  .card h3 { margin: 0 0 10px; color: var(--crimson); font-size: 16px; border-bottom: 2px solid #efe6d6; padding-bottom: 6px; }
  table.std-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.std-table th, table.std-table td { border: 1px solid var(--border); padding: 8px 10px; text-align: center; }
  table.std-table th { background: #f2eadc; }
  .elem-bars { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 12px 0; }
  .eb-item { background: #faf6ee; border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px; }
  .eb-track { height: 8px; background: #e5ddd0; border-radius: 99px; overflow: hidden; margin-top: 5px; }
  .eb-fill { height: 100%; border-radius: 99px; }
  .dayun-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; margin-top: 12px; }
  .dy-card { border: 1px solid var(--border); border-radius: 7px; padding: 7px 5px; text-align: center; font-size: 11.5px; background: #fff; }
  .dy-card.active { border: 2px solid var(--crimson); background: var(--crimson-soft); }
  .qm-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .qm-box { border: 1.5px solid var(--border); border-radius: 8px; padding: 12px; background: #fff; min-height: 125px; display: flex; flex-direction: column; justify-content: space-between; }
  .qm-box.cat-door { border-color: var(--jade); background: #f7fcfa; }
  .prompt-area { width: 100%; min-height: 220px; font-family: Consolas, monospace; font-size: 12px; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: #fbf9f5; }

  /* AI GEMINI PANEL */
  .btn-ai-cta {
    width: 100%; padding: 10px 12px; border: 1px solid #d4a448; border-radius: 7px; cursor: pointer;
    background: linear-gradient(135deg, #c28e2c, #8c5c12); color: #fff;
    font-weight: 800; font-size: 13px; letter-spacing: 0.4px; margin-top: 8px;
    box-shadow: 0 3px 10px rgba(194,142,44,0.3);
  }
  .btn-ai-cta:hover { filter: brightness(1.08); }
  .btn-ai-cta:disabled { opacity: 0.6; cursor: not-allowed; }
  .ai-controls {
    background: #faf6ee; border: 1px solid var(--border); border-radius: 9px;
    padding: 14px 16px; margin-bottom: 14px;
  }
  .ai-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .ai-field label { display: block; font-size: 12px; font-weight: 700; color: #4f4438; margin-bottom: 4px; }
  .ai-field input, .ai-field select, .ai-field textarea {
    width: 100%; padding: 8px 10px; border: 1px solid #cfc2ae; border-radius: 6px;
    background: #fff; color: var(--ink); font-size: 13px; font-family: inherit;
  }
  .ai-status-pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
    border-radius: 99px; font-size: 12px; font-weight: 700; margin-bottom: 10px;
  }
  .ai-status-ok { background: var(--jade-soft); color: var(--jade); border: 1px solid #b5e0cf; }
  .ai-status-warn { background: #fff3cd; color: #855a00; border: 1px solid #f0d58c; }
  .ai-byok-box {
    margin-top: 10px; padding: 10px 12px; background: #fff; border: 1px dashed #c8b89d;
    border-radius: 7px; font-size: 12.5px;
  }
  .ai-byok-box summary { cursor: pointer; font-weight: 700; color: var(--navy); }
  .ai-loader {
    display: flex; align-items: center; gap: 12px; padding: 18px;
    background: var(--gold-soft); border: 1px solid #e7d1a0; border-radius: 8px;
    font-weight: 700; color: #6e4c10; margin: 12px 0;
  }
  .spinner {
    width: 22px; height: 22px; border: 3px solid #e7d1a0; border-top-color: var(--crimson);
    border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ai-error {
    padding: 12px 14px; background: var(--crimson-soft); border: 1px solid #ebb7b2;
    border-left: 4px solid var(--crimson); border-radius: 7px; color: #7e1515;
    font-size: 13px; margin: 10px 0; line-height: 1.5;
  }
  .ai-report-header {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px;
    padding: 10px 14px; background: linear-gradient(135deg, #251f1a, #3a2d24);
    color: #f3dcab; border-radius: 8px 8px 0 0; font-size: 12.5px;
  }
  .ai-report-body {
    background: #fffefc; border: 1px solid var(--border); border-top: none;
    border-radius: 0 0 8px 8px; padding: 20px 24px; line-height: 1.75; font-size: 14.2px;
    color: #241f1b;
  }
  .ai-report-body h1, .ai-report-body h2 {
    color: var(--crimson); border-bottom: 1.5px solid #eee4d3; padding-bottom: 5px;
    margin: 22px 0 10px; font-size: 17.5px;
  }
  .ai-report-body h1:first-child, .ai-report-body h2:first-child { margin-top: 2px; }
  .ai-report-body h3 { color: var(--navy); margin: 16px 0 7px; font-size: 15.2px; }
  .ai-report-body h4 { color: var(--gold); margin: 12px 0 5px; font-size: 14px; }
  .ai-report-body ul, .ai-report-body ol { padding-left: 22px; margin: 6px 0 12px; }
  .ai-report-body li { margin-bottom: 5px; }
  .ai-report-body blockquote {
    margin: 12px 0; padding: 10px 14px; background: var(--gold-soft);
    border-left: 4px solid var(--gold); border-radius: 0 6px 6px 0; color: #4a3714;
  }
  .ai-report-body table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 13px; }
  .ai-report-body th, .ai-report-body td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; }
  .ai-report-body th { background: #f2eadc; color: var(--ink); }
  .ai-report-body code { background: #f2ebe0; padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
  .ai-report-body hr { border: none; border-top: 1px dashed var(--border); margin: 16px 0; }
  .cv-tag-high { display:inline-block; padding:1px 7px; border-radius:4px; background:var(--jade-soft); color:var(--jade); font-weight:800; font-size:12px; }
  .cv-tag-mid { display:inline-block; padding:1px 7px; border-radius:4px; background:#fff3cd; color:#855a00; font-weight:800; font-size:12px; }
  .cv-tag-low { display:inline-block; padding:1px 7px; border-radius:4px; background:var(--crimson-soft); color:var(--crimson); font-weight:800; font-size:12px; }

  /* RESPONSIVE MOBILE & PRINT */
  @media (max-width: 960px) {
    body { grid-template-columns: 1fr; }
    .sidebar { max-height: none; position: static; border-right: none; border-bottom: 2px solid #3a312a; }
    .main { padding: 12px 10px 28px; }
    .tuvi-wrapper { overflow-x: auto; padding-bottom: 6px; }
    .tuvi-board { min-width: 780px; }
    .ai-grid-2 { grid-template-columns: 1fr; }
    .elem-bars { grid-template-columns: repeat(2, 1fr); }
    .dayun-grid { grid-template-columns: repeat(3, 1fr); }
    .qm-board { grid-template-columns: 1fr; }
    .toolbar-right { margin-left: 0; width: 100%; flex-wrap: wrap; }
  }
  @media print {
    body { display: block; background: #fff; }
    .sidebar, .tabs, .ai-controls, .ai-report-header button { display: none !important; }
    .main { padding: 0; }
    .card { border: none; padding: 0; }
  }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="brand">
    <div class="brand-logo">☯️</div>
    <div>
      <div class="brand-title">KB-TUVI STUDIO</div>
      <div class="brand-sub">Zero-Hallucination Metaphysics Engine</div>
    </div>
  </div>

  <div class="sec-label">1. Thông Tin Đương Số</div>
  <div class="field">
    <label>Họ tên / Biệt danh</label>
    <input id="inp-name" value="Đương Số Mẫu" placeholder="Nhập họ tên...">
  </div>
  <div class="row-2">
    <div class="field">
      <label>Giới tính</label>
      <select id="inp-gender">
        <option value="nam">Nam (Càn Tạo)</option>
        <option value="nu">Nữ (Khôn Tạo)</option>
      </select>
    </div>
    <div class="field">
      <label>Loại lịch nhập</label>
      <select id="inp-datetype">
        <option value="solar">Dương lịch</option>
        <option value="lunar">Âm lịch</option>
      </select>
    </div>
  </div>
  <div class="row-2">
    <div class="field">
      <label>Ngày sinh</label>
      <input type="date" id="inp-date" value="1990-05-15">
    </div>
    <div class="field">
      <label>Giờ phút sinh (24h)</label>
      <input type="time" id="inp-time" value="09:30">
    </div>
  </div>
  <label class="chk-row"><input type="checkbox" id="inp-leap"> Tháng Nhuận (nếu nhập Âm lịch)</label>

  <div class="row-2">
    <div class="field">
      <label>Nơi sinh (Việt Nam)</label>
      <select id="inp-place">
        <option value="Hà Nội">Hà Nội (105.85°E)</option>
        <option value="TP. Hồ Chí Minh">TP.HCM (106.63°E)</option>
        <option value="Đà Nẵng">Đà Nẵng (108.20°E)</option>
        <option value="Hải Phòng">Hải Phòng (106.68°E)</option>
        <option value="Cần Thơ">Cần Thơ (105.78°E)</option>
        <option value="Huế">Huế (107.59°E)</option>
        <option value="Quảng Ninh">Quảng Ninh (107.08°E)</option>
        <option value="Nghệ An">Nghệ An (105.68°E)</option>
        <option value="Thanh Hóa">Thanh Hóa (105.78°E)</option>
        <option value="Khánh Hòa">Nha Trang (109.19°E)</option>
        <option value="Lâm Đồng">Đà Lạt (108.44°E)</option>
        <option value="Đắk Lắk">Buôn Ma Thuột (108.04°E)</option>
        <option value="Điện Biên">Điện Biên (103.02°E)</option>
        <option value="Lào Cai">Lào Cai (103.97°E)</option>
        <option value="Cà Mau">Cà Mau (105.15°E)</option>
      </select>
    </div>
    <div class="field">
      <label>Năm xem hạn</label>
      <input type="number" id="inp-target-year" value="2026" min="1940" max="2080">
    </div>
  </div>

  <div class="sec-label">2. Đồng Bộ Quốc Tế & Trường Phái</div>
  <label class="chk-row"><input type="checkbox" id="inp-tst" checked> Hiệu chỉnh Giờ Chân Thái Dương (Kinh độ + EoT)</label>
  <div class="field">
    <label>Chuẩn Lịch Âm Tử Vi</label>
    <select id="inp-calstd">
      <option value="vn">Việt Nam chuẩn (UTC+7 Hồ Ngọc Đức)</option>
      <option value="intl">Quốc tế iztro / 6tail (UTC+8 Bắc Kinh)</option>
    </select>
  </div>
  <div class="row-2">
    <div class="field">
      <label>An Hỏa / Linh</label>
      <select id="inp-school">
        <option value="iztro">Chuẩn iztro / Toàn Thư</option>
        <option value="vn">Nam Phái VN</option>
      </select>
    </div>
    <div class="field">
      <label>Dạ Tý (23h–24h)</label>
      <select id="inp-zisect">
        <option value="2">Sect 2: Giữ Can Ngày</option>
        <option value="1">Sect 1: Sang Ngày Mới</option>
      </select>
    </div>
  </div>

  <div class="sec-label">3. Khởi Quẻ Kinh Dịch & Kỳ Môn</div>
  <div class="field">
    <label>Câu hỏi sự việc cần quyết đoán</label>
    <input id="inp-question" placeholder="VD: Đầu tư dự án quý tới có thuận không?">
  </div>
  <div class="field">
    <label>Phương pháp lập quẻ</label>
    <select id="inp-ic-method" onchange="onMethodChange()">
      <option value="coins_random">Gieo 3 Đồng Xu Tự Động (Chuẩn xác suất)</option>
      <option value="manual_lines">Tự Tung 3 Đồng Xu 6 Lần / Nhập 6 Hào</option>
      <option value="numbers">Mai Hoa Dịch Số (Nhập 2–3 số)</option>
      <option value="time">Mai Hoa Theo Giờ Hiện Tại</option>
    </select>
  </div>

  <div id="box-manual-coins" class="coin-box" style="display:none;">
    <div style="display:flex; gap:6px;">
      <button type="button" class="btn-sec" onclick="tossOneLine()">🪙 Tung 3 Xu (Hào tiếp)</button>
      <button type="button" class="btn-sec" onclick="resetToss()">↺ Xóa</button>
    </div>
    <input id="inp-lines" value="7,8,9,7,6,8" style="margin-top:6px;" placeholder="6 hào từ 1->6: VD 7,8,9,7,6,8">
    <div id="coin-log" class="coin-lines-preview"></div>
  </div>

  <div id="box-numbers" class="field" style="display:none; margin-top:6px;">
    <label>Nhập 2 hoặc 3 số tự nhiên (VD: 18,25,3)</label>
    <input id="inp-numbers" value="18,25,3">
  </div>

  <button type="button" class="btn-primary" onclick="runAnalyze()">⚡ LẬP LÁ SỐ & KHỞI QUẺ ĐỒNG BỘ</button>
  <button type="button" class="btn-ai-cta" onclick="quickStartAi()">✨ LUẬN GIẢI BẰNG AI (GEMINI)</button>
</aside>

<main class="main">
  <div id="sync-banner" class="sync-bar">Đang tải dữ liệu...</div>

  <div class="tabs">
    <button class="tab-btn active" id="tab-btn-tuvi" onclick="switchTab('tuvi', this)">🌌 1. Tử Vi Tương Tác (iztro)</button>
    <button class="tab-btn" id="tab-btn-bazi" onclick="switchTab('bazi', this)">📜 2. Bát Tự Tứ Trụ</button>
    <button class="tab-btn" id="tab-btn-iching" onclick="switchTab('iching', this)">☯️ 3. Kinh Dịch Lục Hào</button>
    <button class="tab-btn" id="tab-btn-qimen" onclick="switchTab('qimen', this)">🧭 4. Kỳ Môn Độn Giáp</button>
    <button class="tab-btn" id="tab-btn-ai" onclick="switchTab('ai', this)">✨ 5. Luận Giải AI (Gemini)</button>
    <div class="toolbar-right">
      <button class="action-btn" style="background:var(--gold-soft);border-color:var(--gold);color:#7a4e0b;" onclick="openAiTab()">✨ Luận Giải AI</button>
      <button class="action-btn" onclick="downloadHtmlReport()">💾 Xuất Mệnh Thư HTML</button>
      <button class="action-btn" onclick="window.print()">🖨️ In / Lưu PDF</button>
    </div>
  </div>

  <!-- TAB 1: TỬ VI -->
  <div id="pane-tuvi" class="tab-pane active">
    <div class="tuvi-wrapper" id="tuvi-wrap">
      <svg id="tptc-svg"></svg>
      <div class="tuvi-board" id="tuvi-board"></div>
    </div>
  </div>

  <!-- TAB 2: BÁT TỰ -->
  <div id="pane-bazi" class="tab-pane"></div>

  <!-- TAB 3: KINH DỊCH -->
  <div id="pane-iching" class="tab-pane"></div>

  <!-- TAB 4: KỲ MÔN -->
  <div id="pane-qimen" class="tab-pane"></div>

  <!-- TAB 5: CROSS CHECK & AI PROMPT -->
  <div id="pane-ai" class="tab-pane"></div>
</main>

<script>
let STATE = null;
let SERVER_CFG = {
  server_has_key: false,
  requires_access_code: false,
  default_model: "gemini-3.8-flash",
  available_models: [
    {id: "gemini-3.8-flash", label: "Gemini 3.8 Flash (Mặc định — Mạnh nhất, Free Tier)"},
    {id: "gemini-3.6-flash", label: "Gemini 3.6 Flash (Ổn định — Free Tier)"},
    {id: "gemini-3.5-flash-lite", label: "Gemini 3.5 Flash-Lite (Siêu nhanh — Tiết kiệm quota)"},
    {id: "gemini-2.5-flash", label: "Gemini 2.5 Flash (Dự phòng cho Key cũ)"}
  ]
};
let AI_STATE = {
  loading: false,
  error: "",
  markdown: "",
  metaInfo: null,
  mode: "full",
  focusQuestion: "",
  model: "gemini-3.8-flash",
  elapsed: 0
};
let aiTimerHandle = null;
let SELECTED_BRANCH = null;
let tossedLines = [];

async function loadServerConfig() {
  try {
    const res = await fetch("/api/config");
    const json = await res.json();
    if (json.ok && json.config) {
      SERVER_CFG = json.config;
      AI_STATE.model = SERVER_CFG.default_model || "gemini-3.8-flash";
    }
  } catch (e) {
    console.warn("Không tải được /api/config:", e);
  }
}

function openAiTab() {
  const btn = document.getElementById("tab-btn-ai");
  if (btn) switchTab("ai", btn);
}

async function quickStartAi() {
  await runAnalyze();
  openAiTab();
  runGeminiInterpret();
}

function esc(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function onMethodChange() {
  const m = document.getElementById("inp-ic-method").value;
  document.getElementById("box-manual-coins").style.display = (m === "manual_lines") ? "block" : "none";
  document.getElementById("box-numbers").style.display = (m === "numbers") ? "block" : "none";
}

function tossOneLine() {
  if (tossedLines.length >= 6) tossedLines = [];
  const c1 = Math.random() < 0.5 ? 2 : 3;
  const c2 = Math.random() < 0.5 ? 2 : 3;
  const c3 = Math.random() < 0.5 ? 2 : 3;
  const sum = c1 + c2 + c3;
  tossedLines.push(sum);
  document.getElementById("inp-lines").value = tossedLines.join(",");
  const names = {6:"6 (Lão Âm ---x---)", 7:"7 (Thiếu Dương -------)", 8:"8 (Thiếu Âm --- ---)", 9:"9 (Lão Dương ---o---)"};
  document.getElementById("coin-log").innerHTML = tossedLines.map((v, i) => `Hào ${i+1}: ${names[v]}`).join("<br>");
  if (tossedLines.length === 6) runAnalyze();
}

function resetToss() {
  tossedLines = [];
  document.getElementById("inp-lines").value = "";
  document.getElementById("coin-log").innerHTML = "Đã xóa — bấm Tung 3 Xu đủ 6 lần.";
}

function switchTab(id, btn) {
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.querySelectorAll(".tab-pane").forEach(p => p.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById("pane-" + id).classList.add("active");
  if (id === "tuvi") setTimeout(drawTptcLines, 40);
}

function stepTargetYear(delta) {
  const el = document.getElementById("inp-target-year");
  el.value = parseInt(el.value || "2026", 10) + delta;
  runAnalyze();
}

async function runAnalyze() {
  const payload = {
    name: document.getElementById("inp-name").value,
    gender: document.getElementById("inp-gender").value,
    date_type: document.getElementById("inp-datetype").value,
    date: document.getElementById("inp-date").value,
    is_leap: document.getElementById("inp-leap").checked,
    time: document.getElementById("inp-time").value,
    place: document.getElementById("inp-place").value,
    use_true_solar: document.getElementById("inp-tst").checked,
    calendar_std: document.getElementById("inp-calstd").value,
    tuvi_school: document.getElementById("inp-school").value,
    zi_sect: parseInt(document.getElementById("inp-zisect").value, 10),
    target_year: parseInt(document.getElementById("inp-target-year").value, 10),
    question: document.getElementById("inp-question").value,
    iching_method: document.getElementById("inp-ic-method").value,
    lines: document.getElementById("inp-lines").value,
    numbers: document.getElementById("inp-numbers").value
  };
  const res = await fetch("/api/analyze", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(payload)
  });
  const json = await res.json();
  if (!json.ok) {
    alert("Lỗi dữ liệu: " + json.error);
    return;
  }
  STATE = json.data;
  const menhPalace = STATE.tuvi.palaces_by_branch.find(p => p.is_menh);
  if (SELECTED_BRANCH === null && menhPalace) SELECTED_BRANCH = menhPalace.branch_idx;
  renderAll();
}

function renderAll() {
  renderSyncBanner();
  renderTuviBoard();
  renderBaziPane();
  renderIchingPane();
  renderQimenPane();
  renderAiPane();
}

function renderSyncBanner() {
  const m = STATE.meta;
  const s = m.time_sync_verification;
  const pill = s.lunar_calendars_identical
    ? `<span class="sync-pill sync-ok">✓ Đồng bộ 100% VN (UTC+7) & Quốc tế iztro (UTC+8)</span>`
    : `<span class="sync-pill sync-warn">⚠ Lệch Sóc Múi Giờ: VN=${esc(s.lunar_vn_utc7)} vs iztro=${esc(s.lunar_intl_utc8)}</span>`;
  const warn = m.branch_boundary_warning
    ? `<div style="width:100%; color:#9e1b1b; font-weight:700; font-size:12px;">⚠ ${esc(m.branch_boundary_warning)}</div>`
    : "";
  document.getElementById("sync-banner").innerHTML = `
    ${pill}
    <span><strong>Giờ Đồng Hồ:</strong> ${esc(m.clock_time)} (UTC+7)</span>
    <span><strong>Mốc Vật Lý Quốc Tế:</strong> ${esc(s.utc_instant)} / ${esc(s.beijing_utc8_instant)}</span>
    <span><strong>Chân Thái Dương:</strong> ${esc(m.true_solar_time)} (${m.total_solar_offset_min >= 0 ? '+' : ''}${m.total_solar_offset_min} phút, EoT ${s.equation_of_time_min}p)</span>
    ${warn}
  `;
}

// Tính các cung nhận Phi Tinh Tứ Hóa từ cung đang chọn (SELECTED_BRANCH)
function getFlyingTargets(srcPalace) {
  const map = {}; // branch_idx -> [{type, cls, star}]
  if (!srcPalace || !srcPalace.flying_sihua) return map;
  const styles = {
    "Hóa Lộc": {label: "Phi Lộc", cls: "bdg-fly-loc"},
    "Hóa Quyền": {label: "Phi Quyền", cls: "bdg-fly-quyen"},
    "Hóa Khoa": {label: "Phi Khoa", cls: "bdg-fly-khoa"},
    "Hóa Kỵ": {label: "Phi Kỵ", cls: "bdg-fly-ky"}
  };
  for (const [shType, desc] of Object.entries(srcPalace.flying_sihua)) {
    const m = desc.match(/^(.+?) -> .+?\((.+?)\)/);
    if (m) {
      const starName = m[1];
      const targetBranchName = m[2];
      const destP = STATE.tuvi.palaces_by_branch.find(x => x.branch === targetBranchName);
      if (destP) {
        if (!map[destP.branch_idx]) map[destP.branch_idx] = [];
        map[destP.branch_idx].push({...styles[shType], star: starName});
      }
    }
  }
  return map;
}

function renderPalaceHtml(p, flyTargets) {
  const isSel = p.branch_idx === SELECTED_BRANCH;
  const isOpp = SELECTED_BRANCH !== null && p.branch_idx === (SELECTED_BRANCH + 6) % 12;
  const isTriad = SELECTED_BRANCH !== null && (p.branch_idx === (SELECTED_BRANCH + 4) % 12 || p.branch_idx === (SELECTED_BRANCH + 8) % 12);

  let cls = "palace-cell";
  if (isSel) cls += " selected-palace";
  else if (isOpp) cls += " tptc-opp";
  else if (isTriad) cls += " tptc-peer";

  const badges = [];
  if (p.is_menh) badges.push(`<span class="bdg bdg-menh">MỆNH</span>`);
  if (p.is_than) badges.push(`<span class="bdg bdg-than">THÂN</span>`);
  if (p.has_triet) badges.push(`<span class="bdg bdg-triet">TRIỆT</span>`);
  if (p.has_tuan) badges.push(`<span class="bdg bdg-tuan">TUẦN</span>`);
  if (flyTargets[p.branch_idx]) {
    flyTargets[p.branch_idx].forEach(ft => {
      badges.push(`<span class="bdg ${ft.cls}">✈ ${esc(ft.label)}: ${esc(ft.star)}</span>`);
    });
  }

  let mjHtml = `<div style="color:#999;font-style:italic;font-size:11px;padding-top:6px;">(Vô Chính Diệu)</div>`;
  if (p.major_stars && p.major_stars.length) {
    mjHtml = p.major_stars.map(m => {
      const c = ["M","V","Đ"].includes(m.brightness_code) ? "mj-good" : (m.brightness_code === "H" ? "mj-bad" : "mj-mid");
      return `<div class="mj-item ${c}">${esc(m.name)} <small>(${esc(m.brightness_code)})</small></div>`;
    }).join("");
  }

  const shPills = [];
  (p.natal_sihua || []).forEach(s => {
    shPills.push(`<span class="sh-tag ${s.includes('Hóa Kỵ') ? 'sh-ky' : 'sh-loc'}">${esc(s)}</span>`);
  });
  (p.liunian_sihua || []).forEach(s => {
    shPills.push(`<span class="sh-tag sh-luu">${esc(s)}</span>`);
  });

  const goodStars = (p.auspicious_stars || []).map(x => `<span class="st-cat">${esc(x.name)}</span>`)
    .concat((p.minor_stars || []).slice(0, 8).map(x => `<span class="st-phu">${esc(x)}</span>`));
  const badStars = (p.sha_stars || []).map(x => `<span class="st-sat">${esc(x.name)}</span>`)
    .concat((p.minor_stars || []).slice(8).map(x => `<span class="st-phu">${esc(x)}</span>`));

  return `
    <div class="${cls}" id="palace-b-${p.branch_idx}" onclick="selectPalace(${p.branch_idx})">
      <div class="p-head">
        <span class="p-cc">${esc(p.can_chi)}</span>
        <span class="p-role">${esc(p.palace_name)}</span>
        <span class="p-dh">ĐH ${esc(p.dai_han)}</span>
      </div>
      <div class="p-badges">${badges.join("")}</div>
      <div class="p-majors">${mjHtml}</div>
      <div class="p-sihua">${shPills.join("")}</div>
      <div class="p-minors">
        <div>${goodStars.join(" ")}</div>
        <div>${badStars.join(" ")}</div>
      </div>
      <div class="p-foot">
        <span>${esc(p.vong_thai_tue)}</span>
        <span>${esc(p.vong_bac_si)}</span>
        <span style="color:var(--navy)">${esc(p.vong_truong_sinh)}</span>
      </div>
    </div>
  `;
}

function selectPalace(branchIdx) {
  SELECTED_BRANCH = branchIdx;
  renderTuviBoard();
}

function renderTuviBoard() {
  const tv = STATE.tuvi;
  const prof = tv.profile;
  const tf = tv.target_year_fortune;
  const byB = {};
  tv.palaces_by_branch.forEach(p => { byB[p.branch_idx] = p; });

  const selP = byB[SELECTED_BRANCH] || byB[0];
  const flyTargets = getFlyingTargets(selP);

  const flyRows = Object.entries(selP.flying_sihua || {}).map(([k, v]) =>
    `<div>• <strong>${esc(k)}:</strong> ${esc(v)}</div>`
  ).join("");

  const patList = (tv.classic_patterns || []).map(pt =>
    `<div>★ <strong>${esc(pt.name)}</strong> <em>(${esc(pt.rank)})</em>: ${esc(pt.desc)}</div>`
  ).join("") || "<div>Cấu trúc bình hòa — xem kỹ Tam Phương Tứ Chính & Tứ Hóa.</div>";

  const centerHtml = `
    <div class="thien-ban">
      <div>
        <div class="tb-header">THIÊN BÀN TỬ VI ĐẨU SỐ — ${esc(STATE.meta.name.toUpperCase())}</div>
        <div class="tb-meta">
          <div><strong>Âm Dương / Cục:</strong> ${esc(prof.gender_polarity)} — ${esc(prof.cuc)}</div>
          <div><strong>Âm lịch:</strong> ${esc(prof.lunar_date)} (${esc(prof.birth_hour)})</div>
          <div><strong>Bản Mệnh:</strong> ${esc(prof.ban_menh_nayin)}</div>
          <div><strong>Mệnh / Thân:</strong> ${esc(prof.menh_palace)} | ${esc(prof.than_cu)}</div>
          <div><strong>Tuần / Triệt:</strong> Tuần [${esc(prof.tuan_khong)}] | Triệt [${esc(prof.triet_lo)}]</div>
          <div>
            <strong>Lưu Niên:</strong>
            <span class="yr-stepper">
              <button onclick="stepTargetYear(-1)">◀</button>
              <strong>${tf.target_solar_year} (${esc(tf.liunian_can_chi)} - ${tf.nominal_age}t)</strong>
              <button onclick="stepTargetYear(1)">▶</button>
            </span>
          </div>
        </div>
      </div>
      <div class="fly-inspector">
        <div style="font-weight:800; color:var(--crimson); margin-bottom:3px;">
          🎯 Đang chọn: Cung ${esc(selP.palace_name)} (${esc(selP.can_chi)}) — Phi Tinh Tứ Hóa phóng đi:
        </div>
        ${flyRows}
      </div>
      <div class="fly-inspector" style="max-height:105px; overflow-y:auto;">
        <div style="font-weight:800; color:var(--navy); margin-bottom:3px;">🏛️ Cách Cục Nhận Diện Tự Động:</div>
        ${patList}
      </div>
    </div>
  `;

  document.getElementById("tuvi-board").innerHTML = `
    ${renderPalaceHtml(byB[5], flyTargets)}
    ${renderPalaceHtml(byB[6], flyTargets)}
    ${renderPalaceHtml(byB[7], flyTargets)}
    ${renderPalaceHtml(byB[8], flyTargets)}
    ${renderPalaceHtml(byB[4], flyTargets)}
    ${centerHtml}
    ${renderPalaceHtml(byB[9], flyTargets)}
    ${renderPalaceHtml(byB[3], flyTargets)}
    ${renderPalaceHtml(byB[10], flyTargets)}
    ${renderPalaceHtml(byB[2], flyTargets)}
    ${renderPalaceHtml(byB[1], flyTargets)}
    ${renderPalaceHtml(byB[0], flyTargets)}
    ${renderPalaceHtml(byB[11], flyTargets)}
  `;
  requestAnimationFrame(drawTptcLines);
}

function drawTptcLines() {
  const svg = document.getElementById("tptc-svg");
  const wrap = document.getElementById("tuvi-wrap");
  if (!svg || !wrap || SELECTED_BRANCH === null) return;
  const wRect = wrap.getBoundingClientRect();
  if (wRect.width === 0) return;
  svg.setAttribute("viewBox", `0 0 ${wRect.width} ${wRect.height}`);

  function centerOf(b) {
    const el = document.getElementById("palace-b-" + b);
    if (!el) return null;
    const r = el.getBoundingClientRect();
    return { x: r.left - wRect.left + r.width / 2, y: r.top - wRect.top + r.height / 2 };
  }

  const p0 = centerOf(SELECTED_BRANCH);
  const pOpp = centerOf((SELECTED_BRANCH + 6) % 12);
  const pT1 = centerOf((SELECTED_BRANCH + 4) % 12);
  const pT2 = centerOf((SELECTED_BRANCH + 8) % 12);
  if (!p0 || !pOpp || !pT1 || !pT2) return;

  svg.innerHTML = `
    <polygon points="${p0.x},${p0.y} ${pT1.x},${pT1.y} ${pT2.x},${pT2.y}"
      fill="rgba(168,121,40,0.06)" stroke="rgba(168,121,40,0.65)" stroke-width="2" stroke-dasharray="6,4"/>
    <line x1="${p0.x}" y1="${p0.y}" x2="${pOpp.x}" y2="${pOpp.y}"
      stroke="rgba(143,29,29,0.72)" stroke-width="2.4" stroke-dasharray="4,4"/>
    <circle cx="${p0.x}" cy="${p0.y}" r="5" fill="#8f1d1d"/>
  `;
}
window.addEventListener("resize", drawTptcLines);

function renderBaziPane() {
  const bz = STATE.bazi;
  const p = bz.pillars;
  const cols = ["year", "month", "day", "hour"];
  const elemColors = {"Mộc":"#1f7a4c", "Hỏa":"#c02929", "Thổ":"#9b6b1b", "Kim":"#6e7785", "Thủy":"#1d5fa7"};

  const bars = Object.entries(bz.five_elements_score).map(([el, info]) => `
    <div class="eb-item">
      <div style="display:flex; justify-content:space-between; font-size:12.5px; font-weight:700;">
        <span style="color:${elemColors[el]}">${esc(el)}</span><span>${info.pct}%</span>
      </div>
      <div class="eb-track"><div class="eb-fill" style="width:${Math.min(100, info.pct)}%; background:${elemColors[el]}"></div></div>
    </div>
  `).join("");

  const dyCards = bz.dayun.map(d => `
    <div class="dy-card ${d.is_current ? 'active' : ''}">
      <div style="color:var(--muted)">${esc(d.solar_years)}</div>
      <div style="font-size:15px;font-weight:800;color:var(--navy);margin:3px 0;">${esc(d.can_chi)}</div>
      <div>${esc(d.stem_ten_god)}</div>
      <div style="font-size:10.5px;color:var(--muted)">${esc(d.changsheng)}</div>
    </div>
  `).join("");

  document.getElementById("pane-bazi").innerHTML = `
    <div class="card">
      <h3>📜 Mệnh Bàn Bát Tự Tứ Trụ (Khóa Tiết Khí Thiên Văn JD_UT)</h3>
      <div style="font-size:13px; margin-bottom:10px;">
        <strong>Tiết khí lúc sinh:</strong> ${esc(bz.solar_term_context.current_term)} |
        <strong>Tiết trước:</strong> ${esc(bz.solar_term_context.prev_jie)} |
        <strong>Tiết sau:</strong> ${esc(bz.solar_term_context.next_jie)} |
        <strong>Giao Đại Vận:</strong> ${esc(bz.dayun_handover.offset_after_birth)} (${esc(bz.dayun_handover.exact_handover_date)})
      </div>
      <table class="std-table">
        <thead><tr><th>Hạng mục</th><th>Trụ Năm</th><th>Trụ Tháng (Nguyệt Lệnh)</th><th>Trụ Ngày (Nhật Chủ)</th><th>Trụ Giờ</th></tr></thead>
        <tbody>

function renderMarkdownToHtml(md) {
  if (!md) return "";
  const lines = md.replace(/\r\n/g, "\n").split("\n");
  let html = "";
  let inUl = false;
  let inOl = false;
  let inTable = false;
  let tableHeaderDone = false;

  function closeLists() {
    if (inUl) { html += "</ul>"; inUl = false; }
    if (inOl) { html += "</ol>"; inOl = false; }
  }
  function closeTable() {
    if (inTable) { html += "</tbody></table>"; inTable = false; tableHeaderDone = false; }
  }
  function inlineFmt(str) {
    let s = esc(str);
    s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
    s = s.replace(/🟢\s*ĐỒNG THUẬN CAO/g, '<span class="cv-tag-high">🟢 ĐỒNG THUẬN CAO</span>');
    s = s.replace(/🟡\s*BÁN ĐỒNG THUẬN/g, '<span class="cv-tag-mid">🟡 BÁN ĐỒNG THUẬN</span>');
    s = s.replace(/🔴\s*PHÂN KỲ/g, '<span class="cv-tag-low">🔴 PHÂN KỲ</span>');
    return s;
  }

  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i];
    const line = raw.trim();

    if (!line) {
      closeLists();
      closeTable();
      continue;
    }

    // Table row
    if (line.startsWith("|") && line.endsWith("|")) {
      closeLists();
      const cells = line.slice(1, -1).split("|").map(c => c.trim());
      const isSep = cells.every(c => /^:?-{2,}:?$/.test(c));
      if (isSep) {
        tableHeaderDone = true;
        continue;
      }
      if (!inTable) {
        inTable = true;
        tableHeaderDone = false;
        html += "<table><thead><tr>" + cells.map(c => `<th>${inlineFmt(c)}</th>`).join("") + "</tr></thead><tbody>";
      } else {
        html += "<tr>" + cells.map(c => `<td>${inlineFmt(c)}</td>`).join("") + "</tr>";
      }
      continue;
    } else {
      closeTable();
    }

    if (/^-{3,}$/.test(line) || /^\*{3,}$/.test(line)) {
      closeLists();
      html += "<hr>";
      continue;
    }
    if (line.startsWith("#### ")) { closeLists(); html += `<h4>${inlineFmt(line.slice(5))}</h4>`; continue; }
    if (line.startsWith("### ")) { closeLists(); html += `<h3>${inlineFmt(line.slice(4))}</h3>`; continue; }
    if (line.startsWith("## ")) { closeLists(); html += `<h2>${inlineFmt(line.slice(3))}</h2>`; continue; }
    if (line.startsWith("# ")) { closeLists(); html += `<h1>${inlineFmt(line.slice(2))}</h1>`; continue; }
    if (line.startsWith("> ")) { closeLists(); html += `<blockquote>${inlineFmt(line.slice(2))}</blockquote>`; continue; }

    const ulMatch = line.match(/^[-*•]\s+(.*)$/);
    if (ulMatch) {
      if (inOl) { html += "</ol>"; inOl = false; }
      if (!inUl) { html += "<ul>"; inUl = true; }
      html += `<li>${inlineFmt(ulMatch[1])}</li>`;
      continue;
    }
    const olMatch = line.match(/^\d+\.\s+(.*)$/);
    if (olMatch) {
      if (inUl) { html += "</ul>"; inUl = false; }
      if (!inOl) { html += "<ol>"; inOl = true; }
      html += `<li>${inlineFmt(olMatch[1])}</li>`;
      continue;
    }

    closeLists();
    html += `<p>${inlineFmt(line)}</p>`;
  }
  closeLists();
  closeTable();
  return html;
}

async function runGeminiInterpret() {
  if (!STATE) {
    alert("Vui lòng lập lá số trước khi luận giải AI!");
    return;
  }
  saveUserAiPrefs();

  const userApiKey = (localStorage.getItem("kb_tuvi_user_api_key") || "").trim();
  const accessCode = (localStorage.getItem("kb_tuvi_access_code") || "").trim();
  const sidebarQ = (document.getElementById("inp-question")?.value || "").trim();
  const focusQuestion = (AI_STATE.focusQuestion || sidebarQ).trim();

  if (!SERVER_CFG.server_has_key && !userApiKey) {
    AI_STATE.error = "Máy chủ chưa cấu hình GEMINI_API_KEY chung. Vui lòng mở mục '🔑 Dùng Gemini API Key riêng' bên trên và dán Key miễn phí từ Google AI Studio để luận giải!";
    renderAiPane();
    return;
  }
  if (SERVER_CFG.requires_access_code && !userApiKey && !accessCode) {
    AI_STATE.error = "Vui lòng nhập Mã mời (Access Code) từ chủ web, hoặc dùng Gemini API Key miễn phí của riêng bạn.";
    renderAiPane();
    return;
  }

  AI_STATE.loading = true;
  AI_STATE.error = "";
  AI_STATE.elapsed = 0;
  renderAiPane();

  if (aiTimerHandle) clearInterval(aiTimerHandle);
  const startMs = Date.now();
  aiTimerHandle = setInterval(() => {
    AI_STATE.elapsed = Math.floor((Date.now() - startMs) / 1000);
    const el = document.getElementById("ai-timer-sec");
    if (el) el.textContent = AI_STATE.elapsed + "s";
  }, 1000);

  try {
    // Gửi bản gọn (bỏ export_html để request nhẹ & siêu nhanh)
    const { export_html, ...cleanPayload } = STATE;
    const headers = { "Content-Type": "application/json" };
    if (userApiKey) headers["X-Gemini-Api-Key"] = userApiKey;

    const res = await fetch("/api/interpret", {
      method: "POST",
      headers,
      body: JSON.stringify({
        payload: cleanPayload,
        mode: AI_STATE.mode,
        focus_question: focusQuestion,
        model: AI_STATE.model,
        access_code: accessCode
      })
    });
    const json = await res.json();
    if (!json.ok) {
      AI_STATE.error = json.error || "Có lỗi khi gọi Gemini API.";
    } else {
      AI_STATE.markdown = json.data.markdown || "";
      AI_STATE.metaInfo = json.data;
    }
  } catch (err) {
    AI_STATE.error = "Lỗi kết nối tới máy chủ AI: " + err.message;
  } finally {
    AI_STATE.loading = false;
    if (aiTimerHandle) { clearInterval(aiTimerHandle); aiTimerHandle = null; }
    renderAiPane();
  }
}

        <div class="ai-field" style="margin-bottom:10px;">

          <input id="inp-ai-focus" value="${esc(AI_STATE.focusQuestion)}" onchange="saveUserAiPrefs()" placeholder="VD: Năm 2026 có nên chuyển việc hay mở rộng kinh doanh không? Đường tình duyên và tài chính ra sao?">
        </div>

        ${accessCodeHtml}

        <button type="button" class="btn-ai-cta" style="margin-top:4px;font-size:14px;padding:11px;" onclick="runGeminiInterpret()" ${AI_STATE.loading ? "disabled" : ""}>
          ${AI_STATE.loading ? "⏳ ĐANG LUẬN GIẢI..." : "✨ BẮT ĐẦU LUẬN GIẢI BẰNG AI (GEMINI)"}
        </button>

        <details class="ai-byok-box" ${!SERVER_CFG.server_has_key ? "open" : ""}>
          <summary>🔑 Dùng Gemini API Key riêng của bạn (BYOK — Miễn phí 100%, không bị giới hạn lượt)</summary>
          <div style="margin-top:8px;color:var(--muted);line-height:1.5;">
            Key của bạn chỉ lưu trên trình duyệt cá nhân (<code>localStorage</code>), không bao giờ lưu trên máy chủ.
            Chưa có Key? Lấy miễn phí trong 30 giây tại
            <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" style="color:var(--crimson);font-weight:700;">Google AI Studio ↗</a>
          </div>
          <div class="ai-field" style="margin-top:8px;">
            <input type="password" id="inp-user-apikey" value="${esc(savedKey)}" onchange="saveUserAiPrefs()" placeholder="Dán chuỗi AIzaSy... vào đây (để trống nếu dùng Key chung của web)">
          </div>
        </details>
      </div>

      ${resultBlock}
    </div>

    <div class="card">
      <h3>⚖️ Tóm Tắt Đối Sánh Song Hệ (Tử Vi Đẩu Số × Bát Tự Tứ Trụ)</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:13px;margin-bottom:12px;">
        <div style="padding:12px;background:#fff8f6;border:1px solid #edd0cb;border-radius:8px;">
          <strong style="color:var(--crimson)">Trục Tử Vi Đẩu Số:</strong><br>${esc(cv.tuvi_anchor)}<br><br>
          <strong>Đại Hạn hiện tại:</strong> ${esc(cv.current_decade_sync.tuvi_daihan)}
        </div>
        <div style="padding:12px;background:#f5f8fd;border:1px solid #cbd9ed;border-radius:8px;">
          <strong style="color:var(--navy)">Trục Bát Tự Tứ Trụ:</strong><br>${esc(cv.bazi_anchor)}<br><br>
          <strong>Đại Vận hiện tại:</strong> ${esc(cv.current_decade_sync.bazi_dayun)}
        </div>
      </div>

      <details>
        <summary style="cursor:pointer;font-weight:700;color:var(--muted);font-size:12.5px;">📋 Xem / Copy Master Prompt JSON (nếu muốn tự dán sang ChatGPT / Claude)</summary>
        <div style="margin:8px 0;text-align:right;">
          <button class="action-btn" onclick="copyMasterPrompt()">📋 Copy Prompt</button>
        </div>
        <textarea id="master-prompt-box" class="prompt-area" readonly>${esc(promptTxt)}</textarea>
      </details>
    </div>
  `;
}

function copyAiMarkdown() {
  if (!AI_STATE.markdown) return;
  navigator.clipboard.writeText(AI_STATE.markdown);
  alert("Đã copy toàn bộ bài luận AI (Markdown) vào Clipboard!");
}

function copyMasterPrompt() {
  const el = document.getElementById("master-prompt-box");
  if (!el) return;
  navigator.clipboard.writeText(el.value);
  alert("Đã copy Master Prompt chuẩn hóa vào Clipboard!");
}

function downloadHtmlReport() {
  if (!STATE || !STATE.export_html) return;
  let finalHtml = STATE.export_html;
  if (AI_STATE.markdown) {
    const aiSection = `
      <section style="max-width:1100px;margin:24px auto;padding:24px 28px;background:#fffefc;border:1.5px solid #d4c4a8;border-radius:10px;line-height:1.75;font-family:'Segoe UI',sans-serif;">
        <h2 style="color:#8f1d1d;border-bottom:2px solid #efe4d2;padding-bottom:8px;margin-top:0;">✨ PHẦN LUẬN GIẢI CHUYÊN SÂU BẰNG AI (KB-TUVI × GEMINI)</h2>
        ${renderMarkdownToHtml(AI_STATE.markdown)}
      </section></body>`;
    finalHtml = finalHtml.replace("</body>", aiSection);
  }
  const blob = new Blob([finalHtml], {type: "text/html;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `MenhThu_${(STATE.meta.name || 'laso').replace(/\s+/g, '_')}.html`;
  a.click();
}

window.addEventListener("DOMContentLoaded", async () => {
  await loadServerConfig();
  await runAnalyze();
});
</script>
</body>
</html>
